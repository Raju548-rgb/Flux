<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flux</title>
    <meta name="description" content="Real-time collaborative code editor for teams. Edit, run, and debug together." />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Preconnect + Preload fonts to eliminate FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent flash of unstyled text -->
    <style>
      html { font-family: 'Inter', sans-serif; }
      body { opacity: 0; transition: opacity 0.1s; }
      body.loaded { opacity: 1; }
    </style>
  </head>
  <body class="bg-base text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.fonts.ready.then(() => document.body.classList.add('loaded'));
      setTimeout(() => document.body.classList.add('loaded'), 300);
    </script>
  </body>
</html>
